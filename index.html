<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parliament Seat Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="settings-panel">
        <h2 class="parliament-title">SORDLAND PARLIAMENT CREATOR</h2>

        <div class="form-group">
            <label for="parliamentTitle">Parliament Title</label>
            <input type="text" id="parliamentTitle" value="THE GRAND NATIONAL ASSEMBLY">
        </div>
        <form id="addPartyForm">

            <div class="form-row">
                <div class="form-group">
                    <label for="partyName">Party Name</label>
                    <input type="text" id="partyName" required>
                </div>
                <div class="form-group">
                    <label>Party Color</label>

                    <div class="color-palette" id="colorPalette"></div>

                    <div class="custom-color">
                        <span>Custom:</span>
                        <input type="color" id="partyColor" value="#667eea">
                    </div>
                </div>

            </div>

            <div class="form-group">
                <label>Select Party Logo (Optional)</label>
                <div class="logo-picker" id="logoPicker"></div>
                <div class="custom-logo-upload">
                    <label for="customSvgUpload" class="btn">
                        + Upload SVG
                    </label>

                    <input
                        type="file"
                        id="customSvgUpload"
                        accept=".svg,image/svg+xml"
                        multiple
                        hidden
                    >

                    <small>Upload your own SVG party icons</small>
                </div>
            </div>

            <div class="form-group">
                <label for="partySeats">Number of Seats</label>
                <input type="number" id="partySeats" min="1" required>
                <div class="seats-remaining" id="seatsRemaining"></div>
            </div>

            <button type="submit" class="btn btn-primary">Add Party</button>
        </form>
    </div>

    <div class="advanced-mode-container">

        <button type="button" id="advancedModeToggle" class="btn">
            Advanced Mode ⚙
        </button>

        <div id="advancedModePanel" class="advanced-mode-panel" hidden>

            <h3>Parliament Configuration</h3>

            <!-- Seats per row -->
            <div class="advanced-setting">
                <label for="seatsPerRowInput">
                    Seats per row
                </label>

                <input
                    type="text"
                    id="seatsPerRowInput"
                    value="19, 22, 26, 29, 33, 37, 40, 44"
                >

                <small>Separate each row with a comma.</small>
            </div>

            <!-- Seat radius -->
            <div class="advanced-setting">
                <label for="seatRadiusInput">
                    Seat radius
                </label>

                <input
                    type="number"
                    id="seatRadiusInput"
                    value="12"
                    min="1"
                    max="50"
                >
            </div>

            <!-- Center padding -->
            <div class="advanced-setting">
                <label for="centerPaddingInput">
                    Center padding
                </label>

                <input
                    type="number"
                    id="centerPaddingInput"
                    value="120"
                    min="0"
                    max="500"
                >
            </div>

            <!-- Between seats padding -->
            <div class="advanced-setting">
                <label for="betweenSeatsPaddingInput">
                    Spacing between rows
                </label>

                <input
                    type="number"
                    id="betweenSeatsPaddingInput"
                    value="0"
                    min="0"
                    max="100"
                >
            </div>

            <button type="button" id="applyAdvancedSettings" class="btn">
                Apply Settings
            </button>

            <button type="button" id="resetAdvancedSettings" class="btn">
                Sordland GNA
            </button>

            <button type="button" id="usCongressSettings" class="btn">
                US Congress
            </button>

            <button type="button" id="settings100Seats" class="btn">
                100 Seats
            </button>

        </div>
    </div>

    <div class="parliament-display">
        <div class="parliament-title" id="displayTitle">THE GRAND NATIONAL ASSEMBLY</div>

        <div class="parliament-canvas-wrapper">
            <canvas id="parliamentCanvas" width="700" height="400"></canvas>
        </div>

        <div id="partiesDisplay">
            <div class="empty-state">No parties added yet</div>
        </div>

        <div class="save-button-wrapper">
            <button type="button" id="saveBtn" class="btn"> Save as PNG </button>
        </div>
    </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>

</body>
</html>
